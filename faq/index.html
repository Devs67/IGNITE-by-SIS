<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FAQ — Sreenidhi IGNITE</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div data-header></div>
    <main>
      <section class="wrap page-hero">
        <p class="eyebrow">The useful details</p>
        <h1>QUESTIONS?</h1>
        <p>
          Answers should be confirmed by the event team before this site is
          published.
        </p>
      </section>
      <section class="wrap page-content">
        <div class="faq">
          <article class="faq-item reveal">
            <button class="faq-q">Who can participate?<i>+</i></button>
            <div class="faq-a"><p>[Add approved eligibility details.]</p></div>
          </article>
          <article class="faq-item reveal">
            <button class="faq-q">
              What should participants bring?<i>+</i>
            </button>
            <div class="faq-a">
              <p>[Add approved participant requirements.]</p>
            </div>
          </article>
          <article class="faq-item reveal">
            <button class="faq-q">How are teams formed?<i>+</i></button>
            <div class="faq-a"><p>[Add approved team formation rules.]</p></div>
          </article>
          <article class="faq-item reveal">
            <button class="faq-q">Where is IGNITE held?<i>+</i></button>
            <div class="faq-a"><p>[Add confirmed venue details.]</p></div>
          </article>
          <article class="faq-item reveal">
            <button class="faq-q">
              What are the rules for phones?<i>+</i>
            </button>
            <div class="faq-a"><p>[Add approved phone policy.]</p></div>
          </article>
        </div>
      </section>
    </main>
    <div data-footer></div>
    <script src="../app.js"></script>
  </body>
</html>
