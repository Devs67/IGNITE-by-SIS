<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="100%" height="100%">
  <defs>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f28c28" />
      <stop offset="100%" stopColor="#e25810" />
    </linearGradient>
  </defs>

  <!-- Flame Symbol (Left) -->
  <g transform="translate(180, 20)">
    <!-- Outer flame shape -->
    <path
      d="M50 94 C26 94 8 74 8 46 C8 24 26 4 52 2 C40 22 44 46 58 62 C68 76 66 86 50 94 Z"
      fill="url(#flameGrad)"
      transform="scale(1.15)"
    />
    <!-- Inner cut/glow -->
    <path
      d="M52 2 C66 20 84 44 84 64 C84 86 66 96 50 94 C64 84 66 68 56 50 C46 34 46 20 52 2 Z"
      fill="#ffffff"
      transform="scale(1.15)"
    />
    <!-- Inner flame curve -->
    <path
      d="M44 94 C28 92 18 78 18 62 C18 42 32 26 44 14 C36 30 38 46 48 60 C56 74 52 84 44 94 Z"
      fill="url(#flameGrad)"
      transform="scale(1.15)"
    />
  </g>

  <!-- Top Bars & SREENIDHI -->
  <rect x="315" y="42" width="130" height="8" rx="4" fill="#e26f1e" />
  <rect x="315" y="58" width="195" height="12" rx="6" fill="#0b302e" />

  <text x="318" y="98" font-family="'Space Grotesk', 'Montserrat', 'Arial', sans-serif" font-size="19" font-weight="900" letter-spacing="8" fill="#0b302e">SREENIDHI</text>

  <!-- Master IGNITE Display Typography -->
  <text x="350" y="240" text-anchor="middle" font-family="'Space Grotesk', 'Arial Black', sans-serif" font-size="140" font-weight="900" letter-spacing="-2" fill="#0b302e">IGNITE</text>

  <!-- KINDLE THE INNOVATION WITHIN -->
  <text x="350" y="295" text-anchor="middle" font-family="'Space Grotesk', 'Arial', sans-serif" font-size="20" font-weight="900" letter-spacing="5" fill="#e26f1e">KINDLE THE INNOVATION WITHIN</text>
</svg>
